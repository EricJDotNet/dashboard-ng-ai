name: Code Quality

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ staging, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./dashboard-net-ai

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        # We use --watch=false and --no-progress for CI environments
        run: npm test -- --watch=false --browsers=ChromeHeadless
